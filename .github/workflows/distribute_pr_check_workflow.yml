name: Distribute PR Check Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflow-templates/pr_check_issue_deploy_caller.yml'

jobs:
  distribute:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout canonical caller template
        uses: actions/checkout@v4

      - name: Sync caller workflow to org repos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ORG_SYNC_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const org = 'QLS-MiCM';
            const skipRepo = 'MiCM_PR_Bot';
            const workflowPath = '.github/workflows/pr_check_issue_deploy.yml';
            const branchName = 'automated/sync-pr-check-workflow';
            const prLabels = ['workflow-sync', 'automated'];

            const canonicalPath = path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/workflow-templates/pr_check_issue_deploy_caller.yml'
            );
            const canonicalContent = fs.readFileSync(canonicalPath, 'utf8');

            const normalize = (content) => content.replace(/\r\n/g, '\n').trimEnd() + '\n';
            const canonicalNormalized = normalize(canonicalContent);

            const stats = {
              scanned: 0,
              skippedUpToDate: 0,
              skippedArchived: 0,
              skippedDisabled: 0,
              skippedHostRepo: 0,
              prsOpened: 0,
              skippedExistingPr: 0,
              errors: []
            };

            async function listOrgRepos() {
              const repos = [];
              let page = 1;

              while (true) {
                const { data } = await github.rest.repos.listForOrg({
                  org,
                  per_page: 100,
                  page,
                  type: 'all'
                });

                if (data.length === 0) break;
                repos.push(...data);
                if (data.length < 100) break;
                page++;
              }

              return repos;
            }

            async function getWorkflowContent(owner, repo) {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: workflowPath
                });

                if (Array.isArray(data) || data.type !== 'file') {
                  return null;
                }

                const decoded = Buffer.from(data.content, 'base64').toString('utf8');
                return { content: decoded, sha: data.sha };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function hasOpenSyncPr(owner, repo) {
              const { data: pulls } = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open',
                head: `${owner}:${branchName}`,
                per_page: 100
              });

              return pulls.length > 0;
            }

            async function openSyncPr(owner, repo, defaultBranch) {
              if (await hasOpenSyncPr(owner, repo)) {
                stats.skippedExistingPr++;
                return;
              }

              const ref = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${defaultBranch}`
              });
              const baseSha = ref.data.object.sha;

              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/heads/${branchName}`,
                  sha: baseSha
                });
              } catch (error) {
                if (error.status !== 422) throw error;

                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`,
                  sha: baseSha,
                  force: true
                });
              }

              const existing = await getWorkflowContent(owner, repo);

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: workflowPath,
                message: 'chore: sync PR checklist caller workflow from MiCM_PR_Bot',
                content: Buffer.from(canonicalContent).toString('base64'),
                branch: branchName,
                sha: existing?.sha
              });

              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title: 'chore: sync PR checklist caller workflow',
                head: branchName,
                base: defaultBranch,
                body: [
                  '## Automated workflow sync',
                  '',
                  'This PR adds or updates `.github/workflows/pr_check_issue_deploy.yml` to call the central reusable workflow in [MiCM_PR_Bot](https://github.com/QLS-MiCM/MiCM_PR_Bot).',
                  '',
                  '**Source:** `QLS-MiCM/MiCM_PR_Bot` canonical caller template',
                  '',
                  'Merge to enable PR checklist comments and tracking issue creation on pull request open.',
                  '',
                  '---',
                  '_Opened by `distribute_pr_check_workflow.yml` in MiCM_PR_Bot._'
                ].join('\n')
              });

              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: prLabels
                });
              } catch (labelError) {
                core.warning(
                  `Could not add labels to ${owner}/${repo}#${pr.number}: ${labelError.message}`
                );
              }

              stats.prsOpened++;
              core.info(`Opened PR in ${owner}/${repo}: ${pr.html_url}`);
            }

            const repos = await listOrgRepos();

            for (const repo of repos) {
              stats.scanned++;

              if (repo.name === skipRepo) {
                stats.skippedHostRepo++;
                continue;
              }

              if (repo.archived) {
                stats.skippedArchived++;
                continue;
              }

              if (repo.disabled) {
                stats.skippedDisabled++;
                continue;
              }

              const owner = repo.owner.login;
              const repoName = repo.name;
              const defaultBranch = repo.default_branch;

              try {
                const existing = await getWorkflowContent(owner, repoName);

                if (existing && normalize(existing.content) === canonicalNormalized) {
                  stats.skippedUpToDate++;
                  continue;
                }

                await openSyncPr(owner, repoName, defaultBranch);
              } catch (error) {
                stats.errors.push(`${owner}/${repoName}: ${error.message}`);
                core.error(`Failed to process ${owner}/${repoName}: ${error.message}`);
              }
            }

            const summary = [
              '## PR Check Workflow Distribution Summary',
              '',
              '| Metric | Count |',
              '|--------|-------|',
              `| Repos scanned | ${stats.scanned} |`,
              `| PRs opened | ${stats.prsOpened} |`,
              `| Skipped (up to date) | ${stats.skippedUpToDate} |`,
              `| Skipped (MiCM_PR_Bot) | ${stats.skippedHostRepo} |`,
              `| Skipped (archived) | ${stats.skippedArchived} |`,
              `| Skipped (disabled) | ${stats.skippedDisabled} |`,
              `| Skipped (existing open PR) | ${stats.skippedExistingPr} |`,
              `| Errors | ${stats.errors.length} |`
            ];

            if (stats.errors.length > 0) {
              summary.push('', '### Errors', ...stats.errors.map((e) => `- ${e}`));
            }

            await core.summary.addRaw(summary.join('\n')).write();

            if (stats.errors.length > 0) {
              core.setFailed(`Distribution completed with ${stats.errors.length} error(s).`);
            }
